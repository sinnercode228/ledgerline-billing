# docker compose up --build
# Needs LEDGERLINE_API_KEY and LEDGERLINE_WEBHOOK_SECRET in .env (see .env.example).

x-ledgerline: &ledgerline
  build: .
  image: ledgerline-server:local
  environment:
    LEDGERLINE_DATABASE_URL: postgres://ledgerline:ledgerline@postgres:5432/ledgerline
    LEDGERLINE_API_KEY: ${LEDGERLINE_API_KEY:?set LEDGERLINE_API_KEY in .env}
    LEDGERLINE_WEBHOOK_SECRET: ${LEDGERLINE_WEBHOOK_SECRET:?set LEDGERLINE_WEBHOOK_SECRET in .env}
    LEDGERLINE_TEST_CLOCK: ${LEDGERLINE_TEST_CLOCK:-1}
    LEDGERLINE_DUNNING_RETRY_DAYS: ${LEDGERLINE_DUNNING_RETRY_DAYS:-1,3,5}
    LEDGERLINE_PAYRAIL_WEBHOOK_URL: http://server:3000/webhooks/payrail
    # Where the dashboard runs (npm run dev:web), so it may call the API from the browser.
    LEDGERLINE_CORS_ORIGINS: ${LEDGERLINE_CORS_ORIGINS:-http://localhost:5173}
    LEDGERLINE_LOG_LEVEL: ${LEDGERLINE_LOG_LEVEL:-info}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ledgerline
      POSTGRES_PASSWORD: ledgerline
      POSTGRES_DB: ledgerline
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerline -d ledgerline"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Applies migrations, then seeds a few months of history once (it skips a database that has customers).
  migrate:
    <<: *ledgerline
    command: ["sh", "-c", "node dist/cli/migrate.js && node dist/cli/seed.js"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  server:
    <<: *ledgerline
    command: ["node", "dist/cli/serve.js"]
    ports:
      - "${LEDGERLINE_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *ledgerline
    command: ["node", "dist/cli/worker.js"]
    healthcheck:
      disable: true
    depends_on:
      server:
        condition: service_healthy

volumes:
  pgdata:
