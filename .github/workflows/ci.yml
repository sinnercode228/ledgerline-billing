name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-and-server:
    name: Core and server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ledgerline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ledgerline_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      LEDGERLINE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ledgerline_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The dashboard (web/) gets its own job here.
